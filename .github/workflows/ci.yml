name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A deadlocked test otherwise runs to GitHub's 6-hour default; three runs
    # burned ~14 hours of runner time that way before anyone noticed.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (`requires-python`); 3.14 is what the Dockerfile
        # ships, so it must stay in the matrix or the deployed interpreter is
        # the one version never tested. Bump both together.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/

      # No env vars and no secrets: the suite is hermetic. Every outbound call
      # is mocked, storage is redirected at a temp dir by tests/conftest.py,
      # and the notebook-verification tests get their Jupyter kernel from the
      # venv's own kernelspec (ipykernel is a dependency). conftest.py also
      # sets DATA_CONCIERGE_ENV_FILE="" so a local .env — which core/config.py
      # reads for every field — cannot change what the suite asserts.
      #
      # Do not add `working-directory` here — mcp/registry.py resolves its
      # config relative to the process cwd, and four tests read it.
      - name: Test
        run: pytest -q --no-cov

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fix a failure here by running `uv lock` and committing the result.
      # Kept out of `test` on purpose: the lock does not vary by Python
      # version, so the matrix would check it twice, and it needs no project
      # install. Nothing else watches this file — .roborev.toml excludes
      # uv.lock from review. See CONTRIBUTING.md for why it is a gate.
      - name: Check uv.lock matches pyproject.toml
        run: pip install uv && uv lock --check

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking, because nothing built the image before this job existed and a
    # broken build shipped unnoticed for six days: dependabot bumped the base to
    # python:3.14-slim (#3) while the production stage still copied
    # python3.11/site-packages, so every build — including the documented
    # `docker compose up --build` — failed on a path that no longer existed.

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: verikan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough. The production stage copies site-packages and
      # src/ in separate COPY lines, so a wrong path can still produce an image
      # that builds and then fails to import. Boot it and require both health
      # endpoints — /api/v1/health also proves the API router mounted, which
      # web.py swallows as a warning rather than a crash.
      - name: Smoke-test
        run: |
          docker run -d --name verikan-ci -p 8080:8080 verikan:ci
          for _ in $(seq 1 60); do
            curl -sf localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf localhost:8080/health || { docker logs verikan-ci; exit 1; }
          curl -sf localhost:8080/api/v1/health || { docker logs verikan-ci; exit 1; }
          docker rm -f verikan-ci

  types:
    name: types & formatting (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only. Both checks carry a backlog inherited from before this
    # project was open sourced; they report so the debt stays visible, but they
    # do not block a pull request. See CONTRIBUTING.md.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Formatting drift
        run: ruff format --check src/ tests/ scripts/ || true

      - name: Type check
        run: mypy src/ || true
